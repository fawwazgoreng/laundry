components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by `/api/users/login` or `/api/users/refresh`.

  parameters:
    IdParam:
      name: id
      in: path
      required: true
      description: Numeric resource ID.
      schema:
        type: integer
        minimum: 1
    OrderIdParam:
      name: orderId
      in: path
      required: true
      description: Public order ID string.
      schema:
        type: string
        minLength: 1
    GroupIdParam:
      name: groupId
      in: path
      required: true
      description: Addon group ID.
      schema:
        type: integer
        minimum: 1
    TargetTypeParam:
      name: targetType
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/AddonTargetType'
    TargetIdParam:
      name: targetId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    UploadPathParam:
      name: path
      in: path
      required: true
      description: Path under `backend/public`, for example `products/abc123.png`.
      schema:
        type: string
      style: simple
      explode: false
    AllParam:
      name: all
      in: query
      description: When `true`, include inactive records.
      schema:
        type: string
        enum: ['true', 'false']
        default: 'false'
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      description: Items per page, capped at 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 12
    SearchParam:
      name: search
      in: query
      schema:
        type: string
    CustomerParam:
      name: customer
      in: query
      schema:
        type: string
    ServiceParam:
      name: service
      in: query
      schema:
        type: string
    SortParam:
      name: sort
      in: query
      schema:
        type: string
        enum: [terbaru, terlama, termahal, termurah]
        default: terbaru
    CategoryParam:
      name: category
      in: query
      schema:
        oneOf:
          - $ref: '#/components/schemas/ProductCategory'
          - type: string
            const: all
        default: all
    InStockOnlyParam:
      name: inStockOnly
      in: query
      description: When `true`, return only products with stock.
      schema:
        type: string
        enum: ['true', 'false']
        default: 'false'
    OrderStatusFilterParam:
      name: status
      in: query
      schema:
        oneOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: string
            const: all
        default: all
    LatitudeQuery:
      name: latitude
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
    LongitudeQuery:
      name: longitude
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180

  responses:
    NoContent:
      description: Successfully deleted; no response body.
    BadRequest:
      description: Malformed JSON or invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or revoked bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed to perform the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business rule or database conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Input failed Zod validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Uploaded payload is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserSuccess:
      description: Profile response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    UserCreated:
      description: Account created.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/User'
    NullSuccess:
      description: "Success with `data: null`."
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    type: 'null'
    AddressSuccess:
      description: Address response.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
              - type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Address'
    AddressCreated:
      description: Alamat berhasil ditambahkan.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessEnvelope'
