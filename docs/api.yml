          type: integer
        code:
          type: string
        name:
          type: string
        selection_type:
          $ref: '#/components/schemas/AddonSelectionType'
        is_required:
          type: boolean
        is_active:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/AddonOption'
    Service:
      type: object
      required: [id, name, unit, price_per_unit, description, estimated_duration_hours, is_active, addon_groups]
      properties:
        id:
          type: integer
        name:
          type: string
        unit:
          type: string
        price_per_unit:
          $ref: '#/components/schemas/Money'
        description:
          type: string
        estimated_duration_hours:
          type: integer
        is_active:
          type: boolean
        addon_groups:
          type: array
          items:
            $ref: '#/components/schemas/AddonGroup'
    Product:
      type: object
      required: [id, name, category, price, size, stock, is_active, image, addon_groups]
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          $ref: '#/components/schemas/ProductCategory'
        price:
          $ref: '#/components/schemas/Money'
        size:
          type: string
        stock:
          type: integer
        is_active:
          type: boolean
        image:
          type: string
        addon_groups:
