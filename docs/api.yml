        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Outlets]
      summary: Update an outlet
      description: Admin only. The current schema requires latitude and longitude even when updating other fields.
      operationId: updateOutlet
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
