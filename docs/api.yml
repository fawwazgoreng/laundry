        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
        gateway_ref:
          type: [string, 'null']
        requested_at:
          type: string
          format: date-time
        processed_at:
          type: [string, 'null']
          format: date-time
        order_id:
          type: string
        user_id:
          type: string
        payment_id:
          type: [string, 'null']
    OrderListItem:
      type: object
      required: [id, order_id, status, order_type, refund_eligible, total_amount, payment_method, created_at, customer_id, customer_name, customer_phone, items_summary, items_unit]
