  schemas:
    Money:
      type: string
      pattern: '^\d{1,10}(\.\d{1,2})?$'
      description: Two-decimal money string. The server normalizes it before storage.
      examples: ['15000.00']
    Meta:
      type: object
      required: [firstPage, currentPage, lastPage, count]
      properties:
        firstPage:
          type: integer
        currentPage:
          type: integer
        lastPage:
          type: integer
        count:
          type: integer
    SuccessEnvelope:
      type: object
      required: [success, message, data]
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        meta:
          $ref: '#/components/schemas/Meta'
    ErrorResponse:
      type: object
      required: [success, status, message, code, path, requestId]
      properties:
        success:
          type: boolean
          const: false
        status:
          type: integer
        message:
          type: string
        code:
          type: string
        path:
          type: string
        requestId:
          type: string
        details: {}
    SimpleErrorResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string

    UserRole:
      type: string
      enum: [admin, user]
    PaymentStatus:
      type: string
      enum: [PENDING, PAID, FAILED, EXPIRED, REFUNDED]
      description: Standard values. Cancelled transfer orders may carry `DIBATALKAN`.
    PaymentMethod:
      type: string
      enum: [fadarosipay, transfer_bank, cod]
    Bank:
      type: string
      enum: [bca, bni, bri, permata, mandiri]
    OrderStatus:
      type: string
      enum: [BARU, DITERIMA, DIPROSES, SIAP_ANTAR, SELESAI, DIBATALKAN]
    OrderKind:
      type: string
      enum: [PRODUCT, SERVICE]
    RefundStatus:
      type: string
      enum: [REQUESTED, APPROVED, REJECTED, REFUNDED]
    AddonSelectionType:
      type: string
      enum: [single, multiple]
    AddonPriceMode:
      type: string
      enum: [per_unit, per_order]
    AddonTargetType:
      type: string
      enum: [service, product]
    ProductCategory:
      type: string
      enum: [Detergen, Softener, Pewangi, Pemutih, Paket Hemat, Aksesoris, Pembersih Noda]

    User:
      type: object
      required: [id, username, email, role, phone, is_verified]
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          type: string
        is_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
    UserAuth:
      type: object
      required: [user, accessToken, refreshToken]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
        refreshToken:
          type: string
    Address:
