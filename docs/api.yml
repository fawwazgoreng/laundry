      required: [id, label, address_text, latitude, longitude, is_primary, user_id]
      properties:
        id:
          type: integer
        label:
          type: string
        address_text:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        is_primary:
          type: boolean
        user_id:
          type: string
    Outlet:
      type: object
      required: [id, name, latitude, longitude, max_coverage_km, min_order_amount]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: [string, 'null']
        address_text:
          type: [string, 'null']
        latitude:
          type: number
        longitude:
          type: number
        max_coverage_km:
          type: number
        min_order_amount:
          $ref: '#/components/schemas/Money'
        weekly_hours:
          type: [string, 'null']
    DeliveryQuote:
      type: object
      required: [outlet, distance_km, delivery_fee, max_coverage_km, in_range]
      properties:
        outlet:
          $ref: '#/components/schemas/Outlet'
        distance_km:
          type: number
        delivery_fee:
          $ref: '#/components/schemas/Money'
        max_coverage_km:
          type: number
        in_range:
          type: boolean
    AddonOption:
      type: object
      required: [id, name, price, price_mode, is_default, is_active]
      properties:
        id:
          type: integer
        name:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        price_mode:
          $ref: '#/components/schemas/AddonPriceMode'
        is_default:
          type: boolean
        is_active:
          type: boolean
    AddonGroup:
      type: object
      required: [id, code, name, selection_type, is_required, is_active, options]
      properties:
