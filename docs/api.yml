          type: string
        transaction_id:
          type: string
        payment_type:
          type: string
        gross_amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          description: Common values are PENDING, PAID, FAILED, EXPIRED, REFUNDED; cancelled transfer orders may use DIBATALKAN.
        va_number:
          type: [string, 'null']
        paid_at:
          type: [string, 'null']
          format: date-time
        raw_response:
          type: [object, 'null']
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    Refund:
      type: object
      required: [id, status, amount, reason, gateway_ref, requested_at, processed_at, order_id, user_id, payment_id]
      properties:
        id:
          type: string
        status:
