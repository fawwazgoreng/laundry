  /api/addons/groups/{groupId}/options:
    post:
      tags: [Addons]
      summary: Create an addon option in a group
      operationId: createAddonOption
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GroupIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonOptionCreateRequest'
      responses:
        '201':
          $ref: '#/components/responses/AddonGroupCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/addons/options/{id}:
    parameters:
      - $ref: '#/components/parameters/IdParam'
    put:
      tags: [Addons]
      summary: Update an addon option
      operationId: updateAddonOption
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonOptionUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/AddonGroupSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Addons]
      summary: Delete/deactivate an addon option
      operationId: deleteAddonOption
      security:
        - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/addons/targets/{targetType}/{targetId}:
    parameters:
      - $ref: '#/components/parameters/TargetTypeParam'
      - $ref: '#/components/parameters/TargetIdParam'
    get:
      tags: [Addons]
      summary: Get addon group IDs attached to a target
      operationId: getAddonTargets
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar ID grup add-on.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Addons]
      summary: Replace addon groups attached to a target
      operationId: setAddonTargets
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddonTargetsRequest'
      responses:
        '200':
          description: Daftar ID grup add-on setelah diperbarui.
          content:
            application/json:
