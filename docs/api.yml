        total_product:
          $ref: '#/components/schemas/Money'
        total_addon:
          $ref: '#/components/schemas/Money'
        delivery_fee:
          $ref: '#/components/schemas/Money'
        total_amount:
          $ref: '#/components/schemas/Money'
        distance_km:
          type: number
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        notes:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        customer:
          type: object
          required: [id, username, phone]
          properties:
            id:
              type: string
            username:
              type: string
            phone:
              type: string
            email:
              type: string
        address:
          type: [object, 'null']
          properties:
            id:
              type: integer
            label:
              type: string
            address_text:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        outlet:
          type: [object, 'null']
          properties:
            id:
              type: integer
            name:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        services:
          type: array
          items:
            type: object
        products:
          type: array
          items:
            type: object
        payment:
          oneOf:
            - $ref: '#/components/schemas/Payment'
            - type: 'null'
        refund:
          oneOf:
            - $ref: '#/components/schemas/Refund'
            - type: 'null'
        trackings:
          type: array
          items:
            $ref: '#/components/schemas/OrderTracking'
