            $ref: '#/components/schemas/OrderServiceInput'
        products:
          type: array
          default: []
          items:
            $ref: '#/components/schemas/OrderProductInput'
        user_address_id:
          type: integer
          minimum: 1
        outlet_id:
          type: integer
          minimum: 1
          description: Accepted but ignored; outlet is recomputed from the address.
        distance_km:
          type: number
          minimum: 0
          description: Accepted but ignored; distance is recomputed.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        delivery_fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Accepted but ignored; fee is recomputed.
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        bank:
          allOf:
            - $ref: '#/components/schemas/Bank'
          description: Required when payment_method is transfer_bank.
        notes:
          type: string
    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
    PaymentConfirmRequest:
      type: object
      required: [transaction_id]
      properties:
        transaction_id:
          type: string
          minLength: 1
        status:
          type: string
          enum: [PAID, FAILED, EXPIRED]
          default: PAID
        raw_response:
          type: object
          additionalProperties: true
    RefundCreateRequest:
      type: object
      required: [order_id, reason]
      properties:
        order_id:
          type: string
          minLength: 1
          maxLength: 50
        reason:
          type: string
          minLength: 10
          maxLength: 500
    RefundDecisionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [APPROVED, REJECTED]
        note:
          type: string
          maxLength: 500
    MidtransNotificationRequest:
      type: object
      required: [order_id, status_code, gross_amount, signature_key]
      properties:
        order_id:
          type: string
        status_code:
          type: string
          description: Midtrans status code; numeric values are coerced by the server.
        gross_amount:
          type: string
          description: Gross amount; numeric values are coerced by the server.
        signature_key:
          type: string
        transaction_status:
          type: string
        payment_type:
          type: string
        fraud_status:
          type: string
        va_numbers:
          type: array
          items:
            type: object
            required: [bank, va_number]
            properties:
              bank:
                type: string
              va_number:
                type: string
        permata_va_number:
          type: string
        bill_key:
          type: string
        biller_code:
          type: string
        transaction_time:
          type: string
