openapi: 3.1.0
info:
  title: Fadarosi API
  version: 1.0.0
  description: |
    HTTP API for the Fadarosi laundry business system.

    Most endpoints return `{ success, message, data, meta? }` on success and
    `{ success, status, message, code, path, requestId, details? }` on error.
    The Midtrans webhook and a few upload errors intentionally differ.

    All `/api/*` requests are rate limited to 300 requests per 15 minutes.
    Register, login, and refresh are additionally limited to 10 requests per 15 minutes.
    `/health` and `/uploads/*` are outside the `/api/*` rate limit.
  contact:
    name: Fadarosi
servers:
  - url: http://localhost:3000
    description: Local backend
security: []
tags:
  - name: System
  - name: Users
  - name: Addresses
  - name: Outlets
  - name: Services
  - name: Addons
  - name: Products
  - name: Orders
  - name: Payments
  - name: Refunds
  - name: Admin
  - name: Midtrans

paths:
  /health:
    get:
      tags: [System]
      summary: Database-backed health check
      operationId: getHealth
      responses:
        '200':
          description: Service and database are healthy.
          content:
            application/json:
              schema:
                type: object
                required: [success, status, database]
                properties:
                  success:
                    type: boolean
                    const: true
                  status:
                    type: string
                    const: ok
                  database:
                    type: string
                    const: up
        '503':
          description: Database query failed or timed out after 3 seconds.
          content:
            application/json:
              schema:
                type: object
                required: [success, status, database]
                properties:
                  success:
                    type: boolean
                    const: false
                  status:
                    type: string
                    const: degraded
                  database:
                    type: string
                    const: down

  /uploads/{path}:
    get:
      tags: [System]
      summary: Serve uploaded static files
      description: Files are served from the backend `public/` directory. No API envelope is used.
      operationId: getUpload
      parameters:
        - $ref: '#/components/parameters/UploadPathParam'
      responses:
        '200':
          description: File content.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content for a range request.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/register:
    post:
      tags: [Users]
      summary: Register a new user
      description: Public endpoint with the stricter 10/15m auth rate limit.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/login:
    post:
      tags: [Users]
      summary: Log in and issue tokens
      description: Public endpoint with the stricter 10/15m auth rate limit.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserAuth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/refresh:
    post:
      tags: [Users]
      summary: Rotate access and refresh tokens
      description: Public endpoint with the stricter 10/15m auth rate limit.
      operationId: refreshTokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UserAuth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/logout:
    post:
      tags: [Users]
      summary: Log out and revoke current tokens
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/NullSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/me:
    get:
      tags: [Users]
      summary: Get authenticated profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/profile:
    put:
      tags: [Users]
      summary: Update own username and phone
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          $ref: '#/components/responses/UserSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/addresses:
    get:
      tags: [Addresses]
      summary: List authenticated user's addresses
      operationId: listAddresses
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar alamat.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
