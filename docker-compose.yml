services:
  db:
    image: docker.io/library/postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - back-tier 
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL" , "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/laundry
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back-tier  

  frontend:
    build: 
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=dev
    networks:
      - back-tier
      - front-tier

  ngrok:
    image: docker.io/ngrok/ngrok
    restart: unless-stopped
    command:
      - "http"
      - "frontend:80"
      - "--host-header=rewrite"
    ports:
      - "4040:4040"
    depends_on:
      - frontend
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    networks:
      - front-tier

volumes:
  postgres_data:

secrets:
  server-certificate:
    external: true

networks:
  front-tier:
    driver: bridge
  back-tier:
    driver: bridge